name: CI

on:
  push:
    branches-ignore: ["gh-pages"]
    tags-ignore: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: SDK Android 37
        run: |
          # SDK préinstallé sur les runners GitHub : on ajoute juste la plateforme 37.
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v5
      # Jars Android de Robolectric (~200 Mo), téléchargés depuis Maven Central à chaque test sinon.
      - name: Cache Robolectric
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Banque de questions à jour
        run: |
          node questions/build.mjs
          git diff --exit-code app/src/main/assets/questions.json
      - name: Banque des jeux à jour
        run: |
          node games/validate.mjs
          node games/build.mjs
          git diff --exit-code app/src/main/assets/games.json
      - name: Tests et build debug
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Captures d'écran
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: screenshots
          path: app/build/outputs/roborazzi/screenshots/

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Test de bout en bout (wrangler dev + D1 local)
        run: |
          npx wrangler d1 migrations apply miroir --local
          npx wrangler dev --local --port 8787 > wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8787/health > /dev/null && break; sleep 1; done
          node scripts/smoke.mjs
