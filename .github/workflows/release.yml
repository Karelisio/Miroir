name: Release

# Publie une GitHub Release (APK signé + changelog) à chaque tag vX.Y.Z.
# versionCode = numéro d'exécution du workflow, versionName = tag sans le « v ».
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (X.Y.Z) pour un build manuel, sans publication"
        required: true
        default: "0.0.0"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: SDK Android 37
        run: |
          # SDK préinstallé sur les runners GitHub : on ajoute juste la plateforme 37.
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v5

      - name: Version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="${{ inputs.version }}"; fi
          echo "VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "Miroir $VERSION (code ${{ github.run_number }})"

      - name: Secrets (google-services.json et keystore)
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Une release doit toujours être signée avec le même keystore, sinon la mise à jour in-app échoue.
          for v in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v manquant"; exit 1; fi
          done
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON_B64 absent : APK sans notifications push (FCM)."
          fi

      - name: Tests unitaires
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: APK release signé
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Vérification de la signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$APK" | tee signature.txt
          if grep -q "CN=Android Debug" signature.txt; then echo "::error::APK signé avec la clé de debug"; exit 1; fi
          mkdir -p dist && cp "$APK" "dist/Miroir-v${VERSION_NAME}.apk"

      - name: Changelog
        run: |
          # Section « ## [X.Y.Z] » de CHANGELOG.md si elle existe, sinon les commits depuis le tag précédent.
          awk -v v="$VERSION_NAME" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md || true
          if [ ! -s notes.md ]; then
            PREV=$(git describe --tags --abbrev=0 "HEAD^" 2>/dev/null || true)
            echo "## Nouveautés" > notes.md
            git log --no-merges --pretty='- %s' ${PREV:+$PREV..}HEAD >> notes.md
          fi
          cat notes.md

      - uses: actions/upload-artifact@v6
        with:
          name: Miroir-v${{ env.VERSION_NAME }}
          path: dist/*.apk
          if-no-files-found: error

      - name: GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Miroir ${{ env.VERSION_NAME }}
          body_path: notes.md
          files: dist/*.apk
          make_latest: true
